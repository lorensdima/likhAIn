<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Moodboard MVP</title>
    <link href="output.css" rel="stylesheet">
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-purple-100 min-h-screen flex flex-col items-center py-10">
    <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-8">
      <h1 class="text-3xl font-bold mb-6 text-center text-purple-700 flex items-center justify-center gap-2">
        <span>💡</span> Moodboard MVP
      </h1>
      <div class="flex gap-2 mb-6">
        <input
          id="ideaInput"
          placeholder="Type your idea..."
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 transition"
        />
        <button
          onclick="addIdea()"
          class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
        >
          Add
        </button>
        <button
          onclick="suggestIdea()"
          class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-lg hover:bg-yellow-500 transition flex items-center gap-1"
        >
          ✨ Suggest
        </button>
      </div>
      <ul id="ideaList" class="space-y-3"></ul>
    </div>
    <script>
      async function refreshIdeas() {
        const ideas = await window.api.getIdeas();
        const list = document.getElementById("ideaList");
        list.innerHTML = "";
        ideas.forEach((i) => {
          const li = document.createElement("li");
          li.className =
            "bg-purple-50 border border-purple-200 rounded-lg px-4 py-3 flex justify-between items-center shadow-sm";
          li.innerHTML =
            `<span class="idea-text text-gray-800">${i.text}</span>` +
            `<span class="ml-4 text-xs text-gray-500">${i.created_at}</span>`;
          list.appendChild(li);
        });
      }

      async function addIdea() {
        const input = document.getElementById("ideaInput");
        if (input.value.trim() === "") return;
        await window.api.addIdea(input.value.trim());
        input.value = "";
        refreshIdeas();
      }

      async function suggestIdea() {
        const generated = await window.api.generateContent(
          "Suggest a new creative idea for my moodboard"
        );
        await window.api.addIdea(generated);
        refreshIdeas();
      }

      refreshIdeas();
    </script>
  </body>
</html>
